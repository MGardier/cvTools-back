services:

  # ─── MAIN DB API ─────────────────────────────────
  api-postgres:
    image: postgres:18.3-alpine3.23
    restart: unless-stopped
    profiles: ["dev"]
    environment:
      POSTGRES_USER: ${API_POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${API_POSTGRES_PASSWORD:?err}
      POSTGRES_DB: ${API_POSTGRES_DB:-cv_tools}
    volumes:
      - api_postgres_data:/var/lib/postgresql
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5


  # ─── TEST DB API (ephemeral) ─────────────────────────────────

  test-postgres:
    image: postgres:18.3-alpine3.23
    restart: unless-stopped
    profiles: ["test"]
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-test}  
      POSTGRES_DB: ${TEST_POSTGRES_DB:-cv_tools_test}
    tmpfs:
      - /var/lib/postgresql
    ports:
      - '5434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5


  # ─── MS EMAIL DB API  ─────────────────────────────────
  ms-postgres:
    image: postgres:18.3-alpine3.23
    restart: unless-stopped
    profiles: ["dev"]
    environment:
      POSTGRES_USER: ${MS_POSTGRES_USER:-ms_email_user}
      POSTGRES_PASSWORD: ${MS_POSTGRES_PASSWORD:?err}
      POSTGRES_DB: ${MS_POSTGRES_DB:-ms_email}
    volumes:
      - ms_postgres_data:/var/lib/postgresql
    ports:
      - '5435:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5


  # ─── Message broker between API & MS ────────────────────
  rabbitmq:
    image: rabbitmq:4.3.0-management-alpine
    restart: unless-stopped
    profiles: ["dev"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?err}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?err}
    ports:
      - '5672:5672'   # AMQP
      - '15672:15672' # UI management
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running'] 
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  # ─── Application cache (pure cache, no persistence) ────────
  redis:
    image: redis:8.6.2-alpine
    restart: unless-stopped
    profiles: ["dev","test"]
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    # No volume: pure cache; the content is rebuilt after a restart
    
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5


  # ─── DEV TOOLS ONLY (dev profil) ─────────────────────
  pgadmin:
    image: dpage/pgadmin4:9.14.0
    restart: unless-stopped
    profiles: ["dev"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?err}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - '5050:80'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/misc/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      api-postgres:
        condition: service_healthy
      ms-postgres:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.29.7
    restart: unless-stopped
    profiles: ["dev"]
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:8025/api/v1/info']
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  api_postgres_data:
  ms_postgres_data:
  rabbitmq_data:
  pgadmin_data:
